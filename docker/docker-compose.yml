# 善阅坊本地开发中间件一键启动
# 使用方式：docker compose up -d

# Compose project name shown in Docker Desktop.
name: shanyuefang-reader

services:

  # ───────────────── PostgreSQL ─────────────────
  postgres:
    image: postgres:16-alpine
    container_name: reader-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql  # 自动建库脚本
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────── Redis ─────────────────
  redis:
    image: redis:7-alpine
    container_name: reader-redis
    command: redis-server --requirepass ""  # 开发环境不设密码
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────── RabbitMQ ─────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: reader-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP 端口
      - "15672:15672"  # 管理控制台 http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────── Nacos MySQL (Nacos internal storage only) ─────────────────
  nacos-mysql:
    image: mysql:8.0
    container_name: reader-nacos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: nacos
      MYSQL_DATABASE: nacos
      MYSQL_USER: nacos
      MYSQL_PASSWORD: nacos
    ports:
      - "3307:3306"    # 3307 avoids conflict with any local MySQL on 3306
    volumes:
      - nacos_mysql_data:/var/lib/mysql
      - ./nacos-mysql-schema.sql:/docker-entrypoint-initdb.d/nacos-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unacos", "-pnacos"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────── Nacos ─────────────────
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: reader-nacos
    depends_on:
      nacos-mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: nacos-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: nacos
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"    # Nacos console: http://localhost:8848/nacos  (nacos/nacos)
      - "9848:9848"    # gRPC port
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ───────────────── Nacos 配置初始化（一次性容器）─────────────────
  init-nacos:
    image: alpine:3.19
    container_name: reader-nacos-init
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./nacos-init.sh:/nacos-init.sh:ro
    command: ["sh", "-c", "apk add -q --no-cache curl && sh /nacos-init.sh"]
    restart: "no"

  # ───────────────── Elasticsearch ─────────────────
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: reader-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # 开发环境关闭安全认证
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ───────────────── MinIO ─────────────────
  minio:
    image: minio/minio:latest
    container_name: reader-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # API 端口
      - "9001:9001"    # 控制台 http://localhost:9001
    volumes:
      - minio_data:/data

  # Milvus is the production vector-store target for Agent embeddings.
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: reader-milvus-etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - milvus_etcd_data:/etcd

  milvus:
    image: milvusdb/milvus:v2.4.9
    container_name: reader-milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      - milvus-etcd
      - minio
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/healthz | grep -q OK"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Graph persistence is provisioned separately from application tables.
  neo4j:
    image: neo4j:5-community
    container_name: reader-neo4j
    environment:
      NEO4J_AUTH: neo4j/reader-agent-dev
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p reader-agent-dev 'RETURN 1' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: reader-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # Optional local Trace backend for Agent model, retrieval, and tool-call spans.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: reader-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: reader-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro

volumes:
  # Keep the existing data volumes when the Compose project is renamed.
  postgres_data:
    name: docker_postgres_data
    external: true
  redis_data:
    name: docker_redis_data
    external: true
  rabbitmq_data:
    name: docker_rabbitmq_data
    external: true
  nacos_mysql_data:
    name: docker_nacos_mysql_data
    external: true
  nacos_data:
    name: docker_nacos_data
    external: true
  es_data:
    name: docker_es_data
    external: true
  minio_data:
    name: docker_minio_data
    external: true
  milvus_etcd_data:
    name: docker_milvus_etcd_data
    external: true
  milvus_data:
    name: docker_milvus_data
    external: true
  neo4j_data:
    name: docker_neo4j_data
    external: true
  prometheus_data:
    name: docker_prometheus_data
    external: true
