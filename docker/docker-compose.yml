version: '3.8'

# 善阅坊本地开发中间件一键启动
# 使用方式：docker compose up -d

services:

  # ───────────────── PostgreSQL ─────────────────
  postgres:
    image: postgres:16-alpine
    container_name: reader-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql  # 自动建库脚本
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────── Redis ─────────────────
  redis:
    image: redis:7-alpine
    container_name: reader-redis
    command: redis-server --requirepass ""  # 开发环境不设密码
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────── RabbitMQ ─────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: reader-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP 端口
      - "15672:15672"  # 管理控制台 http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────── Nacos MySQL (Nacos internal storage only) ─────────────────
  nacos-mysql:
    image: mysql:8.0
    container_name: reader-nacos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: nacos
      MYSQL_DATABASE: nacos
      MYSQL_USER: nacos
      MYSQL_PASSWORD: nacos
    ports:
      - "3307:3306"    # 3307 avoids conflict with any local MySQL on 3306
    volumes:
      - nacos_mysql_data:/var/lib/mysql
      - ./nacos-mysql-schema.sql:/docker-entrypoint-initdb.d/nacos-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unacos", "-pnacos"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────── Nacos ─────────────────
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: reader-nacos
    depends_on:
      nacos-mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: nacos-mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: nacos
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"    # Nacos console: http://localhost:8848/nacos  (nacos/nacos)
      - "9848:9848"    # gRPC port
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ───────────────── Nacos 配置初始化（一次性容器）─────────────────
  init-nacos:
    image: alpine:3.19
    container_name: reader-nacos-init
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./nacos-init.sh:/nacos-init.sh:ro
    command: ["sh", "-c", "apk add -q --no-cache curl && sh /nacos-init.sh"]
    restart: "no"

  # ───────────────── Elasticsearch ─────────────────
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: reader-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # 开发环境关闭安全认证
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ───────────────── MinIO ─────────────────
  minio:
    image: minio/minio:latest
    container_name: reader-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # API 端口
      - "9001:9001"    # 控制台 http://localhost:9001
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  nacos_mysql_data:
  nacos_data:
  es_data:
  minio_data:
