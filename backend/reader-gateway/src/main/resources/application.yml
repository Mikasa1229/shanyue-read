server:
  port: 8080

spring:
  application:
    name: reader-gateway
  profiles:
    active: dev
  config:
    import: "optional:nacos:reader-gateway.yaml"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        group: reader
    gateway:
      discovery:
        locator:
          enabled: true          # 鑷姩浠?Nacos 鍙戠幇鏈嶅姟
          lower-case-service-id: true
      routes:
        - id: reader-user
          uri: lb://reader-user
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: reader-novel
          uri: lb://reader-novel
          predicates:
            - Path=/api/novels/**
        - id: reader-comment
          uri: lb://reader-comment
          predicates:
            - Path=/api/comments/**
        - id: reader-interaction
          uri: lb://reader-interaction
          predicates:
            - Path=/api/interactions/**
        - id: reader-checkin
          uri: lb://reader-checkin
          predicates:
            - Path=/api/checkins/**

  # Redis锛圫a-Token 鍏变韩浼氳瘽锛?  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

# Sa-Token 閰嶇疆
sa-token:
  token-name: Authorization
  timeout: 86400          # Token 鏈夋晥鏈燂細1澶╋紙绉掞級
  active-timeout: 1800    # 娲昏穬缁锛?0鍒嗛挓
  is-concurrent: false    # 鍚岃处鍙蜂笉鍏佽澶氱鐧诲綍
  is-share: true
  token-style: uuid

logging:
  level:
    com.shanyuefang: debug
