server:
  port: 8083

spring:
  application:
    name: reader-comment
  profiles:
    active: dev
  config:
    import: "optional:nacos:reader-comment.yaml"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        group: reader
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/db_comment
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:guest}
    password: ${MQ_PASSWORD:guest}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3

mybatis-plus:
  mapper-locations: classpath*:com/shanyuefang/**/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
      id-type: input

# Feign 瓒呮椂閰嶇疆
feign:
  client:
    config:
      reader-user:
        connect-timeout: 2000   # 2s 杩炴帴瓒呮椂
        read-timeout: 3000      # 3s 璇昏秴鏃?  circuitbreaker:
    enabled: true               # 寮€鍚?Fallback

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.shanyuefang: debug
