server:
  port: 8081

spring:
  application:
    name: reader-user
  profiles:
    active: dev
  config:
    import: "optional:nacos:reader-user.yaml"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        group: reader
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/db_user
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  rabbitmq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:guest}
    password: ${MQ_PASSWORD:guest}
    virtual-host: /
    publisher-confirm-type: correlated   # 生产者确认
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual          # 手动 ACK
        retry:
          enabled: true
          max-attempts: 3

mybatis-plus:
  mapper-locations: classpath*:com/shanyuefang/**/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
      id-type: input                      # 应用层雪花算法生成 ID

# Sa-Token（与 Gateway 共享 Redis，token-style 保持一致）
sa-token:
  token-name: Authorization
  token-prefix: Bearer    # 与 Gateway 保持一致，前端发送 "Bearer <token>" 格式
  timeout: 86400
  active-timeout: 1800
  is-concurrent: false
  is-share: true
  token-style: uuid

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.shanyuefang: debug
