name: Novel Agent Quality

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run all backend tests
        run: mvn -B test -Dtest='*Test' -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  deployment-config:
    name: Deployment and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        working-directory: docker
        run: docker compose -f docker-compose.yml config --quiet
      - name: Reject committed local secret files
        shell: bash
        run: |
          test ! -e .env
          ! git ls-files -z | xargs -0 -r grep -nE '(DEEPSEEK_API_KEY|AGENT_(GATEWAY|INTERNAL|ENCRYPTION)_TOKEN|AGENT_(RERANKER|EMBEDDING)_API_KEY)=[^$\n#]+' --
